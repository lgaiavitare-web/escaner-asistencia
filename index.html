<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner de Asistencia - GAIA VITARE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root { --bg-main: #F4F7FE; --text-dark: #2B3674; --text-gray: #A3AED0; --primary: #1abc9c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .logo-container { text-align: center; margin-bottom: 30px; margin-top: 20px; }
    .logo-container img { max-width: 160px; }
    
    #asistencia-menu { width: 100%; max-width: 500px; animation: fadeIn 0.4s; }
    .asistencia-card { background: white; border-radius: 15px; padding: 40px 20px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: all 0.3s ease; margin-bottom: 25px; }
    .asistencia-card:active { transform: scale(0.98); }
    .asistencia-card.ingreso { border-color: #27ae60; }
    .asistencia-card.salida { border-color: #e74c3c; }
    .asistencia-card i { font-size: 60px; margin-bottom: 15px; }
    .asistencia-card h3 { color: var(--text-dark); font-size: 22px; margin-bottom: 10px; }
    .asistencia-card p { color: var(--text-gray); font-size: 14px; }

    #asistencia-scanner { width: 100%; max-width: 500px; display: none; animation: fadeIn 0.4s; }
    .scanner-view { background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: var(--text-dark); margin-bottom: 5px; font-weight: bold; }
    .input-field { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #e0e6ed; border-radius: 8px; outline: none; background: #fff; color: var(--text-dark); }
    
    /* Input con InputMode = none bloquea el teclado virtual en Android/iOS */
    .scanner-input { width: 100%; padding: 15px 20px; font-size: 22px; text-align: center; border: 2px solid #ccc; border-radius: 10px; outline: none; font-weight: bold; letter-spacing: 2px; margin: 10px 0; background-color: #fff; }
    .scanner-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(26,188,156,0.2); }
    
    .btn-cancel { background: #f1f5f9; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
    .btn-camera { border: none; padding: 22px; border-radius: 15px; font-weight: bold; font-size: 20px; width: 100%; color: white; display: flex; justify-content: center; align-items: center; gap: 12px; box-shadow: 0 6px 15px rgba(52,152,219,0.4); }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--text-gray); margin-bottom: 20px; display: none; background: #000; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; backdrop-filter: blur(3px); }
    .modal-box { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; animation: scaleIn 0.3s ease; }
    .modal-icon { font-size: 60px; margin-bottom: 15px; }
    .modal-icon.success { color: #27ae60; }
    .modal-icon.error { color: #e74c3c; }
    .modal-msg { font-size: 16px; color: var(--text-dark); line-height: 1.5; margin-bottom: 25px; word-break: break-word; }
    .btn-block { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; width: 100%; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Audio nativo integrado para el bip de escáner -->
  <audio id="beepAudio" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>

  <div class="logo-container">
    <img src="https://i.postimg.cc/R0sW077H/Logo-con-descripcion.png" alt="Logo GEEC GAIA VITARE">
  </div>

  <div id="asistencia-menu">
    <h2 style="text-align:center; color: var(--text-dark); margin-bottom: 25px;">Control de Asistencia</h2>
    <div class="asistencia-card ingreso" onclick="abrirScanner('INGRESO')">
      <i class="fas fa-sign-in-alt" style="color: #27ae60;"></i>
      <h3>Registrar Ingreso</h3>
      <p>Escaneo de código QR para registrar la entrada.</p>
    </div>
    <div class="asistencia-card salida" onclick="abrirScanner('SALIDA')">
      <i class="fas fa-sign-out-alt" style="color: #e74c3c;"></i>
      <h3>Registrar Salida</h3>
      <p>Escaneo de código QR para registrar la salida.</p>
    </div>
  </div>
  
  <div id="asistencia-scanner">
    <div class="scanner-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="btn-cancel" onclick="cerrarScanner()"><i class="fas fa-arrow-left"></i> Volver</button>
        <h2 id="scanner-titulo" style="color: var(--text-dark); margin: 0; font-size: 18px;"></h2>
      </div>
      
      <div class="form-group">
        <label>Fecha del registro:</label>
        <input type="date" id="scannerFecha" class="input-field" readonly style="background-color: #f8fafc; font-weight: bold; text-align: center;">
      </div>
      
      <input type="file" id="scanner_file_nativo" accept="image/*" capture="environment" style="display:none;" onchange="procesarFotoQRNativaAsistencia(event)">
      
      <div style="margin-bottom: 20px;">
        <button id="btnActivarCamara" class="btn-camera" style="background-color: #3498db;" onclick="iniciarCamaraQR()">
          <i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro
        </button>
      </div>
      
      <div id="reader"></div>
      
      <div class="form-group" style="margin-top: 20px;">
        <label>Identificación (Manual o Pistola QR):</label>
        <!-- inputmode="none" es LA CLAVE para que Android/iOS no desplieguen el teclado virtual -->
        <input type="text" id="scannerInput" class="scanner-input" placeholder="Esperando escaneo..." autocomplete="off" inputmode="none" readonly>
      </div>
      <p style="color: var(--text-gray); font-size: 12px; margin-top: 15px; line-height: 1.4;">
        El sistema registrará automáticamente el <strong id="scanner-tipo-text"></strong> una vez detecte el código QR de la tarjeta.
      </p>
    </div>
  </div>

  <div class="modal-overlay" id="modalScannerResultado">
    <div class="modal-box">
      <div id="scannerIcon" class="modal-icon"><i class="fas fa-spinner fa-spin" style="color: #3498db;"></i></div>
      <p class="modal-msg" id="scannerMsg">Validando registro de asistencia...</p>
      <button class="btn-block" id="btnContinuarScanner" style="display: none;" onclick="cerrarModalScanner()">Continuar Escaneando</button>
    </div>
  </div>

  <script>
    let tipoRegistroActual = ''; 
    let html5QrCode = null;

    // =========================================================================
    // ⚠️ PEGA AQUÍ TU NUEVA URL DE APLICACIÓN WEB DE APPS SCRIPT
    // =========================================================================
    const URL_API_GAS = "https://script.google.com/macros/s/AKfycbyb-z6Ak85r81b2n3FvDMjrfArLzEvfRD_rwcM-hGb1bpHvKVykuJnO3ISsJXQYLKK4yw/exec";

    document.addEventListener('DOMContentLoaded', () => {
      const scannerInput = document.getElementById('scannerInput');
      scannerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          procesarEscaneo(this.value.trim());
        }
      });
    });

    function activarAudioYForzarTeclado() {
      // Prepara el audio para que el navegador móvil le otorgue permisos
      const beep = document.getElementById('beepAudio');
      beep.volume = 0;
      beep.play().catch(e => {});
      beep.pause();
      beep.volume = 1;
      
      // Asegurarse de que cualquier elemento activo pierda el foco para esconder teclado
      if(document.activeElement) document.activeElement.blur();
    }

    function abrirScanner(tipo) {
      activarAudioYForzarTeclado();
      
      tipoRegistroActual = tipo;
      document.getElementById('asistencia-menu').style.display = 'none';
      document.getElementById('asistencia-scanner').style.display = 'block';
      
      let titulo = tipo === 'INGRESO' ? 'Registrar Ingresos' : 'Registrar Salidas';
      let color = tipo === 'INGRESO' ? '#27ae60' : '#e74c3c';
      document.getElementById('scanner-titulo').innerHTML = `<i class="fas fa-qrcode" style="color:${color};"></i> ${titulo}`;
      document.getElementById('scanner-tipo-text').textContent = tipo.toLowerCase();
      
      let hoy = new Date();
      let offset = hoy.getTimezoneOffset() * 60000;
      document.getElementById('scannerFecha').value = (new Date(hoy - offset)).toISOString().split('T')[0];
      
      const input = document.getElementById('scannerInput');
      input.value = '';
      input.removeAttribute('readonly'); 
      input.focus(); // El focus con inputmode="none" oculta el teclado y permite leer el QR.
    }

    function detenerCamaraQR() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
          document.getElementById('reader').style.display = 'none';
        }).catch(err => {
          html5QrCode = null;
          document.getElementById('reader').style.display = 'none';
        });
      }
    }

    function dispararCamaraNativaAsistencia() {
      detenerCamaraQR();
      const inputNativo = document.getElementById('scanner_file_nativo');
      if (inputNativo) { inputNativo.value = ""; inputNativo.click(); }
    }

    function procesarFotoQRNativaAsistencia(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      mostrarModalCarga();

      const lectorArchivo = new Html5Qrcode("reader");
      lectorArchivo.scanFile(archivo, true).then(decodedText => {
          try { lectorArchivo.clear(); } catch(e) {}
          procesarEscaneo(decodedText.trim());
      }).catch(err => {
          try { lectorArchivo.clear(); } catch(e) {}
          mostrarError("No se detectó un código QR legible. Vuelva a intentarlo.");
      });
    }

    async function iniciarCamaraQR() {
      activarAudioYForzarTeclado();
      const btn = document.getElementById('btnActivarCamara');
      const readerDiv = document.getElementById('reader');
      
      if (html5QrCode) {
        detenerCamaraQR();
        btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
        btn.style.backgroundColor = '#3498db';
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        dispararCamaraNativaAsistencia(); return;
      }
      
      readerDiv.style.display = 'block';
      btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size: 28px;"></i> Iniciando...';
      btn.style.backgroundColor = '#f39c12';
      btn.disabled = true;

      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          html5QrCode = new Html5Qrcode("reader");
          let cameraId = devices[0].id;
          for (let i = 0; i < devices.length; i++) {
            if (devices[i].label.toLowerCase().includes("back") || devices[i].label.toLowerCase().includes("environment")) {
              cameraId = devices[i].id; break;
            }
          }
          await html5QrCode.start(cameraId, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
              detenerCamaraQR();
              btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
              btn.style.backgroundColor = '#3498db';
              procesarEscaneo(decodedText);
          }, (errorMessage) => {});
          btn.innerHTML = '<i class="fas fa-stop" style="font-size: 28px;"></i> Detener Cámara';
          btn.style.backgroundColor = '#e74c3c';
          btn.disabled = false;
        } else {
          throw new Error("Sin cámaras");
        }
      } catch (err) {
        dispararCamaraNativaAsistencia();
        btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
        btn.style.backgroundColor = '#3498db';
        btn.disabled = false;
      }
    }

    function cerrarScanner() {
      detenerCamaraQR();
      document.getElementById('asistencia-scanner').style.display = 'none';
      document.getElementById('asistencia-menu').style.display = 'block';
      document.getElementById('scannerInput').value = '';
    }

    // El truco principal: al cerrar el modal, forzamos que TODO pierda el foco
    function cerrarModalScanner() {
      document.getElementById('modalScannerResultado').style.display = 'none';
      const input = document.getElementById('scannerInput');
      input.value = '';
      input.disabled = false;
      input.blur(); 
      if(document.activeElement) document.activeElement.blur(); 
      window.focus(); // Devuelve el foco al vacío del documento
      
      // Lo enfocamos de nuevo pero gracias a inputmode="none" el teclado no saltará
      setTimeout(() => { input.focus(); }, 100); 
    }

    function mostrarModalCarga() {
      document.getElementById('modalScannerResultado').style.display = 'flex';
      const icon = document.getElementById('scannerIcon');
      icon.className = 'modal-icon';
      icon.innerHTML = '<i class="fas fa-spinner fa-spin" style="color: #3498db;"></i>';
      document.getElementById('scannerMsg').innerHTML = 'Validando registro de asistencia...';
      document.getElementById('btnContinuarScanner').style.display = 'none';
    }

    function mostrarError(mensaje) {
      document.getElementById('scannerIcon').className = 'modal-icon error';
      document.getElementById('scannerIcon').innerHTML = '<i class="fas fa-times-circle"></i>';
      document.getElementById('scannerMsg').innerHTML = mensaje;
      document.getElementById('btnContinuarScanner').style.display = 'block';
    }

    function procesarEscaneo(valor) {
      if (!valor) return;
      
      // REPRODUCE EL SONIDO "BEEP" AL INSTANTE
      document.getElementById('beepAudio').play().catch(e=>{});

      const input = document.getElementById('scannerInput');
      input.disabled = true; 
      input.value = valor;
      input.blur(); 
      if(document.activeElement) document.activeElement.blur(); // Muerte absoluta al teclado

      mostrarModalCarga();

      fetch(URL_API_GAS, {
        method: 'POST',
        body: JSON.stringify({ action: 'registrarAsistenciaScanner', identificacion: valor, tipoRegistro: tipoRegistroActual }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(response => response.json())
      .then(res => {
        document.getElementById('btnContinuarScanner').style.display = 'block';
        if (res && res.exito) {
          document.getElementById('scannerIcon').className = 'modal-icon success';
          document.getElementById('scannerIcon').innerHTML = '<i class="fas fa-check-circle"></i>';
          let parkingHtml = '';
          if (tipoRegistroActual === 'INGRESO' && res.parqueadero) {
            let auth = res.parqueadero.trim().toUpperCase();
            if (auth === 'NO' || auth === 'N/A' || auth === 'NA' || auth === '') {
              parkingHtml = `<div style="margin-top: 20px; padding: 15px; border-radius: 12px; background: #fee2e2; border: 3px solid #ef4444; color: #b91c1c; animation: scaleIn 0.4s ease;"><i class="fas fa-ban" style="font-size: 30px; margin-bottom: 5px;"></i><div style="font-size: 16px; font-weight: 900; text-transform: uppercase;">SIN PARQUEADERO</div></div>`;
            } else {
              let iconClass = 'fa-parking'; 
              if (auth.includes('MOTO')) iconClass = 'fa-motorcycle';
              else if (auth.includes('CARRO') || auth.includes('AUTO')) iconClass = 'fa-car';
              else if (auth.includes('BICI')) iconClass = 'fa-bicycle';
              parkingHtml = `<div style="margin-top: 20px; padding: 15px; border-radius: 12px; background: #d1fae5; border: 3px solid #10b981; color: #047857; animation: scaleIn 0.4s ease;"><i class="fas ${iconClass}" style="font-size: 35px; margin-bottom: 5px;"></i><div style="font-size: 14px; font-weight: 900; text-transform: uppercase;">PARQUEADERO AUTORIZADO</div><div style="font-size: 20px; font-weight: 900; color: #065f46; margin-top: 8px; background: white; padding: 5px; border-radius: 8px; border: 2px solid #047857;">${auth}</div></div>`;
            }
          }
          document.getElementById('scannerMsg').innerHTML = res.mensaje + parkingHtml; 
        } else {
          mostrarError(res ? res.mensaje : 'Error desconocido. Intente nuevamente.');
        }
      }).catch(err => {
        mostrarError('Error de conexión: ' + err.message);
      });
    }
  </script>
</body>
</html>
