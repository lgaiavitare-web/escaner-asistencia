<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escáner de Asistencia - GAIA VITARE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root { --bg-main: #F4F7FE; --text-dark: #2B3674; --text-gray: #A3AED0; --primary: #1abc9c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .logo-container { text-align: center; margin-bottom: 30px; margin-top: 20px; }
    .logo-container img { max-width: 160px; }
    
    #asistencia-menu { width: 100%; max-width: 500px; animation: fadeIn 0.4s; }
    .asistencia-card { background: white; border-radius: 15px; padding: 40px 20px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: all 0.3s ease; margin-bottom: 25px; }
    .asistencia-card:active { transform: scale(0.98); }
    .asistencia-card.ingreso { border-color: #27ae60; }
    .asistencia-card.salida { border-color: #e74c3c; }
    .asistencia-card i { font-size: 60px; margin-bottom: 15px; }
    .asistencia-card h3 { color: var(--text-dark); font-size: 22px; margin-bottom: 10px; }
    .asistencia-card p { color: var(--text-gray); font-size: 14px; }

    .btn-historial-permisos {
      background-color: #34495e;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      width: 100%;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .btn-historial-permisos:hover { background-color: #2c3e50; }
    .btn-historial-permisos:active { transform: scale(0.98); }

    #asistencia-scanner { width: 100%; max-width: 500px; display: none; animation: fadeIn 0.4s; }
    .scanner-view { background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); text-align: center; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 13px; color: var(--text-dark); margin-bottom: 5px; font-weight: bold; }
    .input-field { width: 100%; padding: 12px; font-size: 15px; border: 2px solid #e0e6ed; border-radius: 8px; outline: none; background: #fff; color: var(--text-dark); }
    
    .scanner-input { width: 100%; padding: 15px 20px; font-size: 20px; text-align: center; border: 2px solid #ccc; border-radius: 10px; outline: none; font-weight: bold; letter-spacing: 2px; margin: 10px 0; background-color: #fff; transition: 0.3s;}
    .scanner-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(26,188,156,0.2); }
    .scanner-input:disabled { background-color: #e9ecef; border-color: #e0e6ed; cursor: not-allowed; }
    
    .btn-cancel { background: #f1f5f9; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn-camera { border: none; padding: 22px; border-radius: 15px; font-weight: bold; font-size: 20px; width: 100%; color: white; display: flex; justify-content: center; align-items: center; gap: 12px; box-shadow: 0 6px 15px rgba(52,152,219,0.4); cursor: pointer; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--text-gray); margin-bottom: 20px; display: none; background: #000; }
    
    /* MODAL DEL HISTORIAL */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; backdrop-filter: blur(3px); }
    .modal-historial-box { background: white; padding: 20px; border-radius: 15px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; animation: scaleIn 0.3s ease; position: relative; }
    .modal-close-icon { position: absolute; top: 15px; right: 20px; font-size: 20px; color: var(--text-gray); cursor: pointer; transition: 0.2s;}
    .modal-close-icon:hover { color: #e74c3c; }
    .search-historial { width: 100%; padding: 10px 15px 10px 35px; border: 1px solid #ccc; border-radius: 30px; font-size: 14px; outline: none; margin-bottom: 15px;}
    .search-icon-h { position: absolute; left: 35px; top: 72px; color: #A3AED0; font-size: 14px; }
    .historial-list { flex: 1; overflow-y: auto; text-align: left; }
    .permiso-item { background: #f8fafc; border: 1px solid #e0e6ed; border-radius: 10px; padding: 15px; margin-bottom: 10px; }
    .permiso-item h4 { color: var(--text-dark); font-size: 15px; margin-bottom: 5px; }
    .permiso-item p { color: var(--text-gray); font-size: 12px; margin-bottom: 4px; }
    .btn-ver-pdf { background-color: #1abc9c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;}
    
    /* NUEVO: SISTEMA DE TOASTS FLOTANTES PARA NO BLOQUEAR LA PANTALLA */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; min-width: 280px; max-width: 350px; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-left: 5px solid #ccc; pointer-events: auto;}
    .toast.show { transform: translateX(0); }
    .toast.success { border-left-color: #27ae60; }
    .toast.error { border-left-color: #e74c3c; }
    .toast.sync { border-left-color: #3498db; }
    .toast i { font-size: 24px; }
    .toast.success i { color: #27ae60; }
    .toast.error i { color: #e74c3c; }
    .toast.sync i { color: #3498db; }
    .toast-content { display: flex; flex-direction: column; text-align: left; }
    .toast-title { font-weight: bold; font-size: 14px; color: var(--text-dark); }
    .toast-msg { font-size: 12px; color: #5f748d; line-height: 1.4; margin-top: 4px;}

    /* NUEVO: INDICADOR DE SINCRONIZACIÓN EN SEGUNDO PLANO */
    .sync-badge { position: fixed; bottom: 20px; right: 20px; background: #f39c12; color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; transition: 0.3s; opacity: 0; transform: translateY(20px); pointer-events: none;}
    .sync-badge.active { opacity: 1; transform: translateY(0); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <!-- Audio nativo integrado para el bip de escáner -->
  <audio id="beepAudio" preload="auto">
    <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
  </audio>

  <!-- CONTENEDOR DE NOTIFICACIONES FLOTANTES (CACHE) -->
  <div class="toast-container" id="toastContainer"></div>
  
  <!-- INDICADOR DE ESTADO DE COLA -->
  <div id="syncBadge" class="sync-badge">
    <i class="fas fa-sync fa-spin"></i> <span>Sincronizando (<span id="syncCount">0</span>)</span>
  </div>

  <div class="logo-container">
    <img src="https://i.postimg.cc/R0sW077H/Logo-con-descripcion.png" alt="Logo GEEC GAIA VITARE">
  </div>

  <div id="asistencia-menu">
    <h2 style="text-align:center; color: var(--text-dark); margin-bottom: 25px;">Control de Asistencia</h2>
    <div class="asistencia-card ingreso" onclick="abrirScanner('INGRESO')">
      <i class="fas fa-sign-in-alt" style="color: #27ae60;"></i>
      <h3>Registrar Ingreso</h3>
      <p>Escaneo de código QR para registrar la entrada.</p>
    </div>
    <div class="asistencia-card salida" onclick="abrirScanner('SALIDA')">
      <i class="fas fa-sign-out-alt" style="color: #e74c3c;"></i>
      <h3>Registrar Salida</h3>
      <p>Escaneo de código QR para registrar la salida.</p>
    </div>
    
    <button class="btn-historial-permisos" onclick="abrirHistorialEscaner()">
      <i class="fas fa-file-alt"></i> Validar Permisos y Novedades
    </button>
  </div>
  
  <div id="asistencia-scanner">
    <div class="scanner-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="btn-cancel" onclick="cerrarScanner()"><i class="fas fa-arrow-left"></i> Volver</button>
        <h2 id="scanner-titulo" style="color: var(--text-dark); margin: 0; font-size: 18px;"></h2>
      </div>
      
      <div class="form-group">
        <label>Fecha del registro:</label>
        <input type="date" id="scannerFecha" class="input-field" readonly style="background-color: #f8fafc; font-weight: bold; text-align: center;">
      </div>
      
      <input type="file" id="scanner_file_nativo" accept="image/*" capture="environment" style="display:none;" onchange="procesarFotoQRNativaAsistencia(event)">
      
      <div style="margin-bottom: 20px;">
        <button id="btnActivarCamara" class="btn-camera" style="background-color: #3498db;" onclick="iniciarCamaraQR()">
          <i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro
        </button>
      </div>
      
      <div id="reader"></div>
      
      <div class="form-group" style="margin-top: 20px;">
        <label>Identificación (Manual o Pistola QR):</label>
        <input type="number" id="scannerInput" class="scanner-input" placeholder="Toca aquí para escribir..." autocomplete="off">
      </div>
      <p style="color: var(--text-gray); font-size: 12px; margin-top: 15px; line-height: 1.4;">
        El sistema enviará el <strong id="scanner-tipo-text"></strong> con la hora exacta en que se detecte el código QR.
      </p>
    </div>
  </div>

  <!-- MODAL: HISTORIAL DE PERMISOS -->
  <div class="modal-overlay" id="modalHistorialScanner">
    <div class="modal-historial-box">
      <i class="fas fa-times modal-close-icon" onclick="document.getElementById('modalHistorialScanner').style.display='none'"></i>
      <h3 style="color: var(--text-dark); margin-bottom: 15px; text-align: left; padding-right: 20px;">
        <i class="fas fa-file-signature"></i> Novedades y Permisos
      </h3>
      
      <div style="position: relative;">
        <i class="fas fa-search search-icon-h" style="top: 13px; left: 15px;"></i>
        <input type="text" id="buscadorPermisos" class="search-historial" placeholder="Buscar empleado o ID..." onkeyup="filtrarHistorialEscaner()">
      </div>
      
      <div class="historial-list" id="listaPermisosEsc">
        <p style="text-align: center; color: var(--text-gray); margin-top: 20px;"><i class="fas fa-spinner fa-spin"></i> Cargando información...</p>
      </div>
    </div>
  </div>
  <script>
    let tipoRegistroActual = ''; 
    let html5QrCode = null;
    let audioCtx = null;
    let listaPermisosGlobal = []; 
    
    // VARIABLES PARA LA COLA DE SINCRONIZACIÓN
    let colaSincronizacion = [];
    let procesandoCola = false;

    // =========================================================================
    // URL DE LA APLICACIÓN WEB DE APPS SCRIPT
    // =========================================================================
    const URL_API_GAS = "https://script.google.com/macros/s/AKfycbyb-z6Ak85r81b2n3FvDMjrfArLzEvfRD_rwcM-hGb1bpHvKVykuJnO3ISsJXQYLKK4yw/exec";

    // ---------------------------------------------------------
    // SISTEMA DE TOASTS (NOTIFICACIONES FLOTANTES)
    // ---------------------------------------------------------
    function mostrarToast(titulo, mensaje, tipo) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      let icon = 'fa-info-circle';
      if(tipo === 'success') icon = 'fa-check-circle';
      if(tipo === 'error') icon = 'fa-times-circle';
      if(tipo === 'sync') icon = 'fa-sync fa-spin';

      toast.innerHTML = `
        <i class="fas ${icon}"></i>
        <div class="toast-content">
          <span class="toast-title">${titulo}</span>
          <span class="toast-msg">${mensaje}</span>
        </div>
      `;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      // Auto-eliminar después de 5 segundos
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 5000);
    }

    function actualizarBadgeSync() {
      const badge = document.getElementById('syncBadge');
      const count = document.getElementById('syncCount');
      count.textContent = colaSincronizacion.length;
      if(colaSincronizacion.length > 0) {
        badge.classList.add('active');
      } else {
        badge.classList.remove('active');
      }
    }

    // ---------------------------------------------------------
    // AUDIO Y CÁMARA
    // ---------------------------------------------------------
    function reproducirSonidoBeep() {
      try {
        const beep = document.getElementById('beepAudio');
        beep.currentTime = 0;
        beep.play().catch(e => {
            // Fallback web audio api
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.12);
        });
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      const scannerInput = document.getElementById('scannerInput');
      scannerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          procesarEscaneo(this.value.trim());
        }
      });
    });

    function activarAudio() {
      const beep = document.getElementById('beepAudio');
      beep.volume = 0;
      beep.play().catch(e => {});
      beep.pause();
      beep.volume = 1;
    }

    function abrirScanner(tipo) {
      activarAudio(); 
      tipoRegistroActual = tipo;
      document.getElementById('asistencia-menu').style.display = 'none';
      document.getElementById('asistencia-scanner').style.display = 'block';
      
      let titulo = tipo === 'INGRESO' ? 'Registrar Ingresos' : 'Registrar Salidas';
      let color = tipo === 'INGRESO' ? '#27ae60' : '#e74c3c';
      document.getElementById('scanner-titulo').innerHTML = `<i class="fas fa-qrcode" style="color:${color};"></i> ${titulo}`;
      document.getElementById('scanner-tipo-text').textContent = tipo.toLowerCase();
      
      let hoy = new Date();
      let offset = hoy.getTimezoneOffset() * 60000;
      document.getElementById('scannerFecha').value = (new Date(hoy - offset)).toISOString().split('T')[0];
      
      const input = document.getElementById('scannerInput');
      input.value = '';
      input.disabled = false;
      // Mantiene el focus automático para uso con pistola conectada
      setTimeout(() => input.focus(), 300);
    }

    function cerrarScanner() {
      detenerCamaraQR();
      document.getElementById('asistencia-scanner').style.display = 'none';
      document.getElementById('asistencia-menu').style.display = 'block';
      document.getElementById('scannerInput').value = '';
    }

    // ---------------------------------------------------------
    // LÓGICA DE PROCESAMIENTO RÁPIDO (ENCOLAR Y SINCRONIZAR)
    // ---------------------------------------------------------
    function procesarEscaneo(valor) {
      if (!valor) return;
      
      // 1. Sonido inmediato y captura de hora exacta
      reproducirSonidoBeep();
      const timestampExacto = new Date().toISOString(); 
      
      // 2. Limpiar la pantalla instantáneamente para el siguiente
      const input = document.getElementById('scannerInput');
      input.value = ''; 
      input.focus(); // Retiene el foco para la pistola USB/Bluetooth
      
      // 3. Agregar a la cola de sincronización en segundo plano
      colaSincronizacion.push({
        identificacion: valor,
        tipoRegistro: tipoRegistroActual,
        timestamp: timestampExacto
      });

      mostrarToast('En Cola', `Lectura: ${valor}`, 'sync');
      actualizarBadgeSync();
      
      // 4. Iniciar el trabajador de fondo si no está activo
      procesarCola();
    }

    async function procesarCola() {
      // Evitar ejecuciones simultáneas y detenerse si está vacía
      if (procesandoCola || colaSincronizacion.length === 0) return;
      
      procesandoCola = true;
      const itemActual = colaSincronizacion[0]; // Toma el más antiguo

      try {
        const response = await fetch(URL_API_GAS, {
          method: 'POST',
          body: JSON.stringify({ 
            action: 'registrarAsistenciaScanner', 
            identificacion: itemActual.identificacion, 
            tipoRegistro: itemActual.tipoRegistro,
            timestamp: itemActual.timestamp
          }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        
        const res = await response.json();

        // 5. Mostrar el resultado de ESTE escaneo usando Toasts (no bloquea)
        if (res && res.exito) {
          let msg = res.nombreEmp ? `<b>${res.nombreEmp}</b>` : `ID: ${itemActual.identificacion}`;
          if (res.parqueadero && res.parqueadero !== 'NO' && itemActual.tipoRegistro === 'INGRESO') {
            msg += `<br><span style="color:#27ae60;font-weight:bold;"><i class="fas fa-parking"></i> PARQUEADERO: ${res.parqueadero}</span>`;
          }
          mostrarToast('Sincronizado', msg, 'success');
        } else {
          // Si el sistema lo rechazó por doble ingreso, invalido, etc.
          mostrarToast('Alerta de Asistencia', res.mensaje || `Error ID: ${itemActual.identificacion}`, 'error');
        }
        
        // 6. Si la red respondió (bien o mal lógicamente), lo quitamos de la cola
        colaSincronizacion.shift();

      } catch (err) {
        mostrarToast('Error de Red', `Retraso en ID: ${itemActual.identificacion}. Reintentando...`, 'error');
        // Si hay error de internet real (ej. se fue el Wifi), se detiene y reintenta en 3 seg
        procesandoCola = false;
        setTimeout(procesarCola, 3000);
        return; 
      }

      // 7. Liberar el procesador y llamar recursivamente por si hay más
      actualizarBadgeSync();
      procesandoCola = false;
      procesarCola();
    }

    // ---------------------------------------------------------
    // LÓGICA DE CÁMARA QR HTML5
    // ---------------------------------------------------------
    function detenerCamaraQR() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
          document.getElementById('reader').style.display = 'none';
        }).catch(err => {
          html5QrCode = null;
          document.getElementById('reader').style.display = 'none';
        });
      }
    }

    function dispararCamaraNativaAsistencia() {
      detenerCamaraQR();
      const inputNativo = document.getElementById('scanner_file_nativo');
      if (inputNativo) { inputNativo.value = ""; inputNativo.click(); }
    }

    function procesarFotoQRNativaAsistencia(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      mostrarToast('Cámara', 'Procesando imagen...', 'sync');
      const lectorArchivo = new Html5Qrcode("reader");
      lectorArchivo.scanFile(archivo, true).then(decodedText => {
          try { lectorArchivo.clear(); } catch(e) {}
          procesarEscaneo(decodedText.trim());
      }).catch(err => {
          try { lectorArchivo.clear(); } catch(e) {}
          mostrarToast("Error", "No se detectó un código QR legible. Intenta de nuevo.", "error");
      });
    }

    async function iniciarCamaraQR() {
      activarAudio();
      const btn = document.getElementById('btnActivarCamara');
      const readerDiv = document.getElementById('reader');
      
      if (html5QrCode) {
        detenerCamaraQR();
        btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
        btn.style.backgroundColor = '#3498db';
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        dispararCamaraNativaAsistencia(); return;
      }
      
      readerDiv.style.display = 'block';
      btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size: 28px;"></i> Iniciando...';
      btn.style.backgroundColor = '#f39c12';
      btn.disabled = true;

      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          html5QrCode = new Html5Qrcode("reader");
          let cameraId = devices[0].id;
          for (let i = 0; i < devices.length; i++) {
            if (devices[i].label.toLowerCase().includes("back") || devices[i].label.toLowerCase().includes("environment")) {
              cameraId = devices[i].id; break;
            }
          }
          await html5QrCode.start(cameraId, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => {
              detenerCamaraQR();
              btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
              btn.style.backgroundColor = '#3498db';
              procesarEscaneo(decodedText);
          }, (errorMessage) => {});
          btn.innerHTML = '<i class="fas fa-stop" style="font-size: 28px;"></i> Detener Cámara';
          btn.style.backgroundColor = '#e74c3c';
          btn.disabled = false;
        } else {
          throw new Error("Sin cámaras");
        }
      } catch (err) {
        dispararCamaraNativaAsistencia();
        btn.innerHTML = '<i class="fas fa-camera" style="font-size: 28px;"></i> Nuevo Registro';
        btn.style.backgroundColor = '#3498db';
        btn.disabled = false;
      }
    }

    // ---------------------------------------------------------
    // LÓGICA DEL HISTORIAL DE PERMISOS
    // ---------------------------------------------------------
    function abrirHistorialEscaner() {
      document.getElementById('modalHistorialScanner').style.display = 'flex';
      const container = document.getElementById('listaPermisosEsc');
      container.innerHTML = '<p style="text-align: center; color: var(--text-gray); margin-top: 20px;"><i class="fas fa-spinner fa-spin" style="font-size:24px;"></i><br><br>Cargando información de la base de datos...</p>';
      document.getElementById('buscadorPermisos').value = '';

      fetch(URL_API_GAS, {
        method: 'POST',
        body: JSON.stringify({ action: 'obtenerHistorialPermisosScanner' }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(response => response.json())
      .then(res => {
        if (res && res.exito) {
          listaPermisosGlobal = res.datos || [];
          renderizarHistorialEscaner();
        } else {
          container.innerHTML = `<p style="text-align: center; color: #e74c3c; margin-top: 20px;">No se pudo cargar el historial: ${res.mensaje}</p>`;
        }
      })
      .catch(err => {
        container.innerHTML = `<p style="text-align: center; color: #e74c3c; margin-top: 20px;">Error de conexión. Verifique su internet.</p>`;
      });
    }

    function renderizarHistorialEscaner() {
      const container = document.getElementById('listaPermisosEsc');
      const filtro = document.getElementById('buscadorPermisos').value.toLowerCase().trim();
      
      let filtrados = listaPermisosGlobal.filter(p => {
        if (!filtro) return true;
        const cadena = `${p.empleado} ${p.id}`.toLowerCase();
        return cadena.includes(filtro);
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-gray); margin-top: 20px;">No se encontraron permisos registrados.</p>';
        return;
      }

      let html = '';
      filtrados.forEach(p => {
        let badgeColor = p.tipo.includes('Remunerado') ? '#1abc9c' : '#f39c12';
        
        let botonVer = '';
        if (p.pdfUrl && p.pdfUrl.startsWith('http')) {
            botonVer = `<button class="btn-ver-pdf" onclick="window.open('${p.pdfUrl}', '_blank')"><i class="fas fa-external-link-alt"></i> Ver Permiso</button>`;
        } else {
            botonVer = `<span style="font-size: 12px; color: #A3AED0;"><i>Soporte no generado</i></span>`;
        }

        html += `
          <div class="permiso-item">
            <h4>${p.empleado}</h4>
            <p><strong><i class="fas fa-calendar-alt"></i> Aplica para:</strong> ${p.fechaAplica}</p>
            <p><strong><i class="fas fa-tag"></i> Tipo:</strong> <span style="background:${badgeColor}; color:white; padding:2px 6px; border-radius:4px; font-weight:bold;">${p.tipo}</span></p>
            <p><strong><i class="fas fa-info-circle"></i> Motivo:</strong> ${p.motivo}</p>
            <p><strong><i class="fas fa-user-tie"></i> Jefe Inmediato:</strong> ${p.jefe}</p>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px dashed #ccc; padding-top:10px;">
              <small style="color: #7f8c8d;">${p.id}</small>
              ${botonVer}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function filtrarHistorialEscaner() {
      renderizarHistorialEscaner();
    }
  </script>
</body>
</html>
